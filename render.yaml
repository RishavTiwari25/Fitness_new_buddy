services:
  - type: web
    name: fitness-buddy-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: HOST
        value: 0.0.0.0
      - key: DB_FILE
        value: /tmp/db.sqlite
      - key: UPLOADS_DIR
        value: /tmp/uploads
